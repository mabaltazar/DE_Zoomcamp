version: 2

sources:
  - name: raw_data
    description: "Raw NYC taxi trip data loaded from BigQuery external tables. Contains both yellow and green taxi trip records for 2019-2020."
    database: taxi_rides_ny
    schema: prod
    tables:
      - name: yellow_tripdata
        description: "Yellow taxi trips, primarily from Manhattan"
        loaded_at_field: tpep_pickup_datetime
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}
      - name: green_tripdata
        description: "Green taxi trip records. Green taxis operate primarily in outer boroughs (outside Manhattan)."
        loaded_at_field: lpep_pickup_datetime
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}


    