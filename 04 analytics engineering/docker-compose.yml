services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyc_taxi_ingestion
    volumes:
      - .:/usr/app
      - /usr/app/.venv
    working_dir: /usr/app
    # Run the ingestion script automatically when spun up, then stop cleanly
    command: ["python", "ingest.py"]



















